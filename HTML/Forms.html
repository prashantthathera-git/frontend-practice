<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
</head>

<body>
    <h2>Registration Form</h2>
    <form action="/Submit">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="username">
        </div>
        <br>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="myemail">
        </div>
        <br>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
        </div>
        <br>
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </div>
        <br>
        <div>
            <label for="Date">Submission Date:</label>
            <input type="date" id="date" name="date">
        </div>
        <br>
        <div>
            <label for="Time">Submission Time:</label>
            <input type="time" id="time" name="time">
        </div>
        <br>
        <div>
            <label for="check">I have read all the above information</label>
            <input type="checkbox" id="check" name="checked">
        </div>
        <br>
        <div>
            <input type="submit" id="submit" name="submit" value="Submit Now">
            <input type="reset" id="reset" name="reset" value="Reset">
        </div>
    </form>
</body>

</html>
